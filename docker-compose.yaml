x-client-base: &client-base
    build:
      context: ./services/client
      dockerfile: Dockerfile
    volumes:
      - ./input:/input
      - ./output:/output
    depends_on:
      - server

services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - OUTPUT_FILE=/output/server_output.csv
      - AGENCY_QUORUM_MIN=6
    ports:
      - "5678:5678"
    volumes:
      - ./output:/output

  client_0:
    <<: *client-base
    container_name: client_0
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=0
      - INPUT_FILE=/input/input-0.csv
      - OUTPUT_FILE=/output/output-0.csv
      - BATCH_SIZE=32

  client_1:
    <<: *client-base
    container_name: client_1
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=1
      - INPUT_FILE=/input/input-1.csv
      - OUTPUT_FILE=/output/output-1.csv
      - BATCH_SIZE=32

    
  client_2:
    <<: *client-base
    container_name: client_2
