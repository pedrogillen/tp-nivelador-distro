x-client-base: &client-base
    build:
      context: ./services/client
      dockerfile: Dockerfile
    volumes:
      - ./input:/input
    depends_on:
      - server

services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - OUTPUT_FILE=/output/output.txt
    ports:
      - "5678:5678"
    volumes:
      - ./output:/output

  client_0:
    <<: *client-base
    container_name: client_0
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=0
      - INPUT_FILE=/input/test.txt

  client_1:
    <<: *client-base
    container_name: client_1
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=1
      - INPUT_FILE=/input/test.txt
    
  client_2:
    <<: *client-base
    container_name: client_2
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=2
      - INPUT_FILE=/input/test.txt

  client_3:
